<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pedidos aceitos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="pedidos_aceitos.css">
</head>
<body>
  <!-- ===== BARRA DE NAVEGAÇÃO ===== -->
  <header class="navbar">
    <a href="#" class="logo">
      <!-- Usa o mesmo logo da pasta PEDIDOS_DISPONIVEIS -->
      <img src="../PEDIDOS_DISPONIVEIS/img/logo-aacd2.png" alt="" class="logo-img" onerror="this.style.display='none'">
    </a>

    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>

    <nav class="menu" id="menu">
      <div class="menu-item dropdown">
        <button class="menu-link">Pedidos <span class="seta">▼</span></button>
        <ul class="dropdown-lista">
          <li><a href="/frontend/VOLUNTARIO/PEDIDOS_DISPONIVEIS/tela_pedidos_disponiveis.html" class="ativo">Pedidos disponíveis</a></li>
          <li><a href="/frontend/VOLUNTARIO/PEDIDOS_ACEITOS/tela_pedidos_aceitos.html" class="ativo">pedidos aceito e recusados</a></li>
        </ul>
      </div>
      <div class="menu-item dropdown">
        <button class="menu-link">Impressora <span class="seta">▼</span></button>
        <ul class="dropdown-lista">
          <li><a href="/frontend/VOLUNTARIO/CADASTRAR_IMPRESSORA/tela_cadastrar_impressora.html" class="ativo">cadastrar impressora</a></li>
          <li><a href="#" class="ativo">Editar impressora cadastrada</a></li>
        </ul>
      </div>
      <div class="menu-item dropdown">
        <button class="menu-link">Produção <span class="seta">▼</span></button>
        <ul class="dropdown-lista">
          <li><a href="/frontend/VOLUNTARIO/EM_PRODUÇAO/tela_em_producao.html" class="ativo">Status produção</a></li>
        </ul>
      </div>
      <div class="menu-item">
        <a href="#" class="menu-link">Sobre</a>
      </div>
    </nav>

    <div class="usuario dropdown">
      <button class="usuario-btn">
        <span class="avatar"></span>
        <span class="usuario-info">
          <span class="usuario-nome">user</span>
          <span class="usuario-cargo">Voluntário</span>
        </span>
        <span class="seta">▼</span>
      </button>
      <ul class="dropdown-lista dropdown-direita">
        <li><a href="#">Meu perfil</a></li>
        <li><a href="#">Configurações</a></li>
        <li><a href="/frontend/TELAS_INICIAIS/TELA_INICIAL/tela_inicial.html">Sair</a></li>
      </ul>
    </div>
  </header>

  <!-- Decoração do canto superior direito -->
  <div class="decoracao" aria-hidden="true">
    <span class="circulo-externo"></span>
    <span class="circulo-interno"></span>
  </div>

  <!-- ===== CONTEÚDO DA PÁGINA ===== -->
  <main class="conteudo">
    <div class="cabecalho-pagina">
      <h1>Pedidos Aceitos e Recusados</h1>
      <p>Pedidos que você aceitou e como eles estão andando.</p>
    </div>

    <div class="filtros">
      <input type="search" id="busca" placeholder="Buscar pelo número do pedido ou produto...">
    </div>

    <!-- Filtro por status (os números são preenchidos pelo JS) -->
    <div class="abas-status" id="abasStatus">
      <button class="aba ativa" data-status="todos">Todos <span class="aba-num" data-contador="todos">0</span></button>
      <button class="aba" data-status="Pendente">Pendente <span class="aba-num" data-contador="Pendente">0</span></button>
      <button class="aba" data-status="Em produção">Em produção <span class="aba-num" data-contador="Em produção">0</span></button>
      <button class="aba" data-status="Concluído">Concluído <span class="aba-num" data-contador="Concluído">0</span></button>
      <button class="aba" data-status="Recusado">Recusado <span class="aba-num" data-contador="Recusado">0</span></button>
    </div>

    <ul class="lista-pedidos" id="listaPedidos"></ul>

    <p class="vazio" id="vazio" hidden>Nenhum pedido encontrado.</p>
  </main>

  <!-- Aviso (toast) -->
  <div class="toast" id="toast"></div>

  <script src="pedidos_aceitos.js"></script>
</body>
</html>
