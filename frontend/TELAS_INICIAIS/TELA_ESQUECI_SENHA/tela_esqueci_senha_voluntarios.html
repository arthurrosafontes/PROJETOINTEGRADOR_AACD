<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recuperar Senha - Voluntário</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="esqueci_senha.css">
</head>
<body>
  <div class="circulo-fundo" aria-hidden="true"></div>

  <main class="card">
    <form class="form" action="#" method="post" onsubmit="window.location.href='../MUDANÇA_SENHA/tela_mudar_senha.html'; return false;">
      <label for="email" class="label">Coloque seu email:</label>
      <input
        type="email"
        id="email"
        name="email"
        class="input"
        placeholder="xxxxxx@gmail.com"
        required
      >

      <button type="button" class="btn-reenviar">Reenviar Código</button>

      <p class="mensagem">
        Enviaremos um código para seu email,<br>
        coloque e irá poder trocar a senha
      </p>

      <button type="submit" class="btn-enviar">Enviar</button>

      <a href="/frontend/LOGIN_VOLUNTARIOS/login_voluntarios.html" class="link-voltar">Voltar para tela anterior</a>
    </form>
  </main>

  <!-- Substitua logo.png pelo arquivo do logo do hospital -->
  <img src="img/logo-aacd2.png" alt="Hospital Ortopédico" class="logo">
</body>
</html>
