<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mudança de Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="mudar_senha.css">
</head>
<body>
    <div class="circulo-fundo" aria-hidden="true"></div>

    <main class="card">
        <form class="form" action="#" method="post" onsubmit="window.location.href='../TELA_INICIAL/Tela.html'; return false;">
            <div class="campo">
                <label for="senha" class="label">Senha</label>
                <input
                    type="password"
                    id="senha"
                    name="senha"
                    class="input"
                    placeholder="Digite sua senha:"
                    required>
            </div>

            <div class="campo">
                <label for="confirmar-senha" class="label">Confirmar Senha</label>
                <input
                    type="password"
                    id="confirmar-senha"
                    name="confirmar-senha"
                    class="input"
                    placeholder="Confirme sua senha:"
                required>
            </div>

            <button type="submit" class="btn-trocar">Trocar senha</button>

            <a href="/frontend/TELAS_INICIAIS/TELA_INICIAL/tela_inicial.html" class="link-voltar">Voltar para tela inicial</a>
        </form>
    </main>

    <!-- Substitua logo.png pelo arquivo do logo do hospital -->
    <img src="img/logo-aacd2.png" alt="Hospital Ortopédico" class="logo">
</body>
</html>
