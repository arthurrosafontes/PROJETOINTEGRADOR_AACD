<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AACD - Login Funcionário</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="tela-login">
        <form class="card-form" action="#" method="post">
            <label for="email" class="card-form__label">Login</label>
            <input type="email" id="email" name="email" class="card-form__input"
                placeholder="[email AACD]" required>

            <label for="senha" class="card-form__label">Senha</label>
            <input type="password" id="senha" name="senha" class="card-form__input"
                placeholder="Digite sua senha:" required>

            <a href="../TELA_ESQUECI_SENHA/tela_esqueci_senha_funcionario.html" class="card-form__esqueci">Esqueci a senha</a>

            <button type="submit" class="card-form__botao">Entrar</button>

            <a href="/frontend/TELA_INICIAL/Tela.html" class="card-form__voltar">Voltar para tela inicial</a>
        </form>

        <div class="marca">
            <span class="marca__texto"></span>
            <img src="img/logo-aacd2.png" alt="AACD" class="marca__logo">
        </div>
    </main>
    <script src="login_funcionario.js"></script>
</body>
</html>
