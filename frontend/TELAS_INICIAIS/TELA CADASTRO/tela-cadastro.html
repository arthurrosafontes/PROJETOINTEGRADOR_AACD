<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cadastro de Voluntário</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="cadastro.css">
</head>
<body>

<main class="card">
  <nav aria-label="Etapas do cadastro">
    <ol class="breadcrumb" id="breadcrumb">
      <li data-step="0"><button type="button">1. Dados do voluntário</button></li>
      <li data-step="1"><button type="button">2. Endereço</button></li>
      <li data-step="2"><button type="button">3. Acesso</button></li>
    </ol>
  </nav>

  <form id="form" novalidate>
    <!-- Etapa 1: Dados -->
    <section class="step active" data-step="0">
      <div class="grid">
        <div class="field full nome">
          <input id="nome" placeholder="Nome do voluntário:" autocomplete="name">
          <span class="error"></span>
        </div>
        <div class="field">
          <input id="email" type="email" placeholder="Email:" autocomplete="email">
          <span class="error"></span>
        </div>
        <div class="field">
          <input id="cnpj" placeholder="CNPJ: AA.AAA.AAA/AAAA-DV" maxlength="18">
          <span class="error"></span>
        </div>
        <div class="field full" style="max-width:560px;justify-self:center;width:100%">
          <input id="telefone" placeholder="Telefone: (XX) XXXXX-XXXX" maxlength="15" autocomplete="tel">
          <span class="error"></span>
        </div>
      </div>
    </section>

    <!-- Etapa 2: Endereço -->
    <section class="step" data-step="1">
      <div class="grid-endereco">
        <div class="field">
          <div class="cep-wrap">
            <input id="cep" placeholder="CEP: 00000-000" maxlength="9" autocomplete="postal-code">
            <span class="cep-status" id="cepStatus"></span>
          </div>
          <span class="error"></span>
        </div>
        <div class="field span-2">
          <input id="rua" placeholder="Rua / Logradouro" autocomplete="address-line1">
          <span class="error"></span>
        </div>
        <div class="field">
          <input id="numero" placeholder="Número">
          <span class="error"></span>
        </div>
        <div class="field span-2">
          <input id="complemento" placeholder="Complemento (opcional)" autocomplete="address-line2">
          <span class="error"></span>
        </div>
        <div class="field">
          <input id="bairro" placeholder="Bairro">
          <span class="error"></span>
        </div>
        <div class="field">
          <input id="cidade" placeholder="Cidade" autocomplete="address-level2">
          <span class="error"></span>
        </div>
        <div class="field">
          <select id="uf" autocomplete="address-level1">
            <option value="">UF</option>
          </select>
          <span class="error"></span>
        </div>
      </div>
    </section>

    <!-- Etapa 3: Acesso -->
    <section class="step" data-step="2">
      <div class="grid">
        <div class="field">
          <input id="senha" type="password" placeholder="Senha" autocomplete="new-password">
          <span class="error"></span>
        </div>
        <div class="field">
          <input id="confirmarSenha" type="password" placeholder="Confirmar Senha:" autocomplete="new-password">
          <span class="error"></span>
        </div>
      </div>
    </section>

    <section class="step" data-step="3">
      <p class="sucesso">Cadastro realizado com sucesso! 🎉</p>
    </section>

    <div class="actions" id="actions">
      <button type="button" class="btn secondary" id="btnAnterior">Anterior</button>
      <button type="submit" class="btn" id="btnProximo">Próximo</button>
    </div>
  </form>

  <a href="#" class="voltar" id="linkVoltar">Voltar para tela anterior</a>
</main>

<div class="logo">Hospital<br>Ortopédico</div>

<script src="cadastro.js"></script>
</body>
</html>
